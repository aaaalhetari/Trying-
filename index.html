<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأنعام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
<style>
:root{
  --bg:#F4F2ED; --surf:#FFFFFF; --ink:#15171A; --mut:#6F6C66; --faint:#9C9890;
  --line:rgba(21,23,26,.09); --line2:rgba(21,23,26,.18);
  --red:#8E1C2B; --red-s:#F7E9EB; --gold:#B08D3F; --rail:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  font-size:15px;line-height:1.6;padding-inline-start:var(--rail);padding-bottom:44px}
h1,h2,.dsp{font-family:"Almarai",system-ui,sans-serif;font-weight:800}
img{display:block;max-width:100%}
.ti{line-height:1}

/* ---------- side rail: same background as the page ---------- */
.rail{position:fixed;inset-inline-start:0;top:0;bottom:0;width:var(--rail);z-index:30;background:var(--bg);
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:2px;padding:14px 4px calc(16px + env(safe-area-inset-bottom));
  overflow-y:auto;scrollbar-width:none;scroll-behavior:smooth;user-select:none;
  overscroll-behavior:contain}
.rail::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;
  border-radius:14px;font-family:"Almarai";font-weight:700;font-size:9.5px;line-height:1.15;text-align:center;
  color:var(--faint);cursor:pointer;transition:background .18s,color .18s}
.tab .ic{width:21px;height:21px}
.tab.on{color:#fff;background:var(--red)}
.tab.off{opacity:.28}

.topbar{position:sticky;top:0;z-index:40;background:var(--bg);will-change:transform}
.brand{position:relative;z-index:1}
.orow{position:relative;z-index:2;background:var(--bg)}
.brand{display:flex;align-items:center;gap:11px;padding:14px 15px 10px 15px;padding-inline-start:8px}
.mark{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:var(--surf);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;padding:3px}
.brand h1{font-size:17.5px;margin:0;line-height:1.15}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.hbtn{height:38px;border-radius:12px;border:1px solid var(--line2);background:var(--surf);
  display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;color:var(--ink)}
.lang{padding:0 13px;font-size:12.5px;font-weight:500}
.prof{width:38px;flex:0 0 38px;font-size:19px}
.orow{display:flex;align-items:center;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;padding:12px 15px 14px;padding-inline-start:8px;scrollbar-width:none}
.orow::-webkit-scrollbar{display:none}
.org{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  background:var(--bg);border:1px solid var(--line2);font-size:13px;color:var(--faint);white-space:nowrap;
  transition:all .16s;user-select:none;cursor:pointer}
.org b{font-weight:500}
.org .fl{font-size:15px;line-height:1}
.org .n{font-size:11px;color:var(--faint);opacity:.75}
.org.on{background:var(--red);border-color:var(--red);color:#fff}
.org.on .n{color:rgba(255,255,255,.72)}

.hero{position:relative;margin:14px 15px 0 15px;margin-inline-start:8px;border-radius:20px;overflow:hidden;height:172px;background:#2A1F1C}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.74}
.hero .hov{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  padding:17px;background:linear-gradient(to top,rgba(12,10,9,.85),rgba(12,10,9,.12) 62%,transparent)}
.hero .eyebrow{font-size:11px;letter-spacing:.12em;color:#E8D9B4}
.hero h2{color:#fff;font-size:21px;margin:3px 0 4px;line-height:1.3}
.hero p{color:rgba(255,255,255,.82);font-size:12.5px;margin:0}
.trust{display:flex;gap:16px;justify-content:center;padding:14px 15px 2px;flex-wrap:wrap}
.tr{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut)}
.tr .ti{font-size:16px;color:var(--red)}

main{padding-inline-start:8px;padding-inline-end:15px}
.secwrap{position:relative;padding-top:42px}
.secwrap:first-child{padding-top:8px}
.sec{display:flex;align-items:center;gap:10px;padding:0 0 14px}
.logo{width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center}
.logo .ic{width:38px;height:38px;color:var(--faint)}
.sec .ttl{font-family:"Almarai";font-weight:800;font-size:19px;line-height:1.25;letter-spacing:-.01em;color:var(--faint)}
.sec .ln{flex:1}

.grid{display:flex;flex-direction:column;gap:11px}
.pcard{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;
  contain:layout paint style;transition:border-color .18s}
.pcard.has{border-color:var(--red);outline:1.5px solid var(--red);outline-offset:-1.5px}
.pimg{position:relative;width:100%;aspect-ratio:2/1;background:#E4DCD0;display:flex;align-items:center;justify-content:center;color:#B0A899}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pimg .ic{width:42px;height:42px;opacity:.7}
.pimg .cnt2{position:absolute;top:10px;inset-inline-start:10px;min-width:23px;height:23px;border-radius:12px;
  background:var(--red);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;
  justify-content:center;padding:0 7px;z-index:2}
.pimg .fav2{position:absolute;top:9px;inset-inline-end:9px;width:33px;height:33px;border-radius:50%;
  background:rgba(255,255,255,.93);display:flex;align-items:center;justify-content:center;font-size:17px;
  color:#B6B1A8;z-index:3;box-shadow:0 2px 8px rgba(21,23,26,.12)}
.pimg .fav2{transition:background .16s,color .16s,transform .16s}
.pimg .fav2.on{background:var(--red);color:#fff;transform:scale(1.06)}
.pimg .tg{position:absolute;bottom:9px;inset-inline-end:9px;background:rgba(255,255,255,.94);color:var(--gold);
  font-size:10px;border-radius:999px;padding:2px 8px;z-index:2}
.pbody{padding:11px 14px 13px}
.prow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pprice{text-align:end}
.pnm{font-family:"Almarai";font-weight:700;font-size:15.5px;line-height:1.3;margin:0 0 6px}
.pmeta{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.pmeta .st{color:var(--gold);display:inline-flex;align-items:center;gap:2px}
.pprice .lb{display:block;font-size:10px;color:var(--faint);line-height:1.1}
.pprice .v{font-family:"Almarai";font-weight:800;font-size:18px}
.pprice .c{font-size:10.5px;color:var(--mut)}
.pcard.has .pprice .lb{color:var(--red)}

footer{margin:30px 15px 0;margin-inline-start:8px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:20px 17px}
footer .fl1{font-family:"Almarai";font-weight:800;font-size:15px;margin-bottom:3px}
footer p{margin:0 0 3px;font-size:12.5px;color:var(--mut)}
footer .row{display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap}
footer .soc{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;color:var(--mut);font-size:17px;text-decoration:none}
footer .pay2{display:flex;gap:7px;margin-inline-start:auto;align-items:center}
footer .pay2 img{height:20px;width:auto;object-fit:contain}
footer .flinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:15px}
footer .flink{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);background:var(--bg);
  border:1px solid var(--line);border-radius:13px;padding:10px 11px;text-decoration:none;line-height:1.35}
footer .flink .ti{font-size:17px;color:var(--red);flex:0 0 auto}
footer .cpy{font-size:11px;color:var(--faint);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

.fab{position:fixed;inset-inline-end:16px;bottom:18px;z-index:46;display:inline-flex;align-items:center;gap:8px;
  background:var(--red);color:#fff;border-radius:999px;padding:8px 8px 8px 16px;padding-inline:16px 8px;
  box-shadow:0 10px 26px rgba(110,20,33,.32);cursor:pointer;
  transition:transform .18s}
.fab:active{transform:scale(.97)}
.fab .t{font-family:"Almarai";font-weight:800;font-size:15px;white-space:nowrap}
.fab .ti{font-size:19px}
.wa{position:fixed;inset-inline-end:16px;bottom:76px;z-index:46;width:44px;height:44px;border-radius:50%;
  background:#1FAF54;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 8px 22px rgba(31,175,84,.3);text-decoration:none}

/* ---------- sheets ---------- */
.veil{position:fixed;inset:0;background:rgba(21,23,26,.5);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline-start:0;inset-inline-end:0;bottom:0;z-index:61;background:var(--bg);
  border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  transform:translateY(101%);transition:transform .28s cubic-bezier(.3,.8,.4,1)}
.sheet.drag{transition:none}
.pad{overscroll-behavior:contain}
.backbar{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;
  background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line)}
.backbar .bk{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:var(--surf);
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer}
.backbar .bt{flex:1;min-width:0;font-family:"Almarai";font-weight:800;font-size:15px;line-height:1.3}
body.locked{position:fixed;width:100%;overflow:hidden}
.sheet.show{transform:translateY(0)}
.pad{padding:0 15px 12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:9px auto 0}
.dhero{position:relative;height:172px;background:#E4DCD0;margin-bottom:-18px}
.dhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero .x{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.dbody{position:relative;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.dnm{font-family:"Almarai";font-weight:800;font-size:20px;line-height:1.3;margin:0 0 6px}
.dmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:16px}
.flagchip{display:inline-flex;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;font-size:11px}
.tagp{font-size:10.5px;color:var(--gold);border:1px solid rgba(176,141,63,.45);border-radius:999px;padding:2px 8px}
.rate{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--gold)}
.blk{font-size:11.5px;color:var(--faint);margin:0 0 9px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:20px}
.opt{border:1px solid var(--line2);border-radius:14px;padding:10px 6px;text-align:center;background:var(--surf);
  cursor:pointer;user-select:none;transition:all .15s}
.opt .q{display:block;font-family:"Almarai";font-weight:700;font-size:13px;line-height:1.25}
.opt .p{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.opt.on{background:var(--red);border-color:var(--red);color:#fff}
.opt.on .p{color:rgba(255,255,255,.82)}
.opt.on .q:before{content:"✓ ";font-size:11px}
.opt.off{background:#F3F1EC;border-color:rgba(21,23,26,.06);color:#B6B1A8}
.opt.off .p{color:#C2BDB3}

.lines{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:4px 13px}
.ln1{padding:12px 0;border-bottom:1px solid var(--line)}
.ln1:last-child{border-bottom:0}
.ln1.off{opacity:.5}
.lhead{display:flex;align-items:flex-start;gap:10px}
.chk{width:23px;height:23px;flex:0 0 23px;margin-top:1px;border-radius:8px;border:1.5px solid var(--line2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .15s}
.chk.on{background:var(--red);border-color:var(--red);color:#fff}
.lname{flex:1;min-width:0;font-family:"Almarai";font-weight:700;font-size:13.5px;line-height:1.4;word-break:break-word}
.lx{flex:0 0 auto;border:0;background:transparent;color:var(--faint);font-size:18px;padding:2px 4px;cursor:pointer;line-height:1}
.preps{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;margin-inline-start:33px;scrollbar-width:none;
  overscroll-behavior-x:contain}
.preps::-webkit-scrollbar{display:none}
.pp{flex:0 0 auto;white-space:nowrap;font-size:11.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);
  color:var(--mut);background:var(--surf);cursor:pointer;white-space:nowrap;user-select:none;transition:all .15s}
.pp.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pp .x{font-size:10px;opacity:.7;margin-inline-start:3px}
.lfoot{display:flex;align-items:center;gap:10px;margin-inline-start:33px;margin-top:9px}
.stp{display:flex;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:2px}
.stp button{width:29px;height:29px;border:0;background:transparent;color:var(--ink);font-size:17px;line-height:1;
  border-radius:50%;cursor:pointer;font-family:"Almarai"}
.stp b{min-width:22px;text-align:center;font-family:"Almarai";font-weight:700;font-size:14px}
.lprice{flex:1;text-align:end;font-family:"Almarai";font-weight:700;font-size:14.5px}
.lunit{font-size:11px;color:var(--faint);font-weight:400;margin-inline-end:5px}

.dfoot{display:flex;align-items:center;gap:11px;position:sticky;bottom:0;z-index:8;
  margin:18px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--line)}
.dtot{flex:1;min-width:0}
.dtot .lb{display:block;font-size:10.5px;color:var(--faint);line-height:1.2}
.dtot .v{font-family:"Almarai";font-weight:800;font-size:22px}
.dtot .c{font-size:12px;color:var(--mut)}
.btn{height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--red);color:#fff;
  font-family:"Almarai";font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line2)}
.btn:disabled{background:var(--line);color:var(--faint)}

.shead{display:flex;align-items:center;gap:10px;padding:12px 2px 11px}
.stitle{font-family:"Almarai";font-weight:800;font-size:19px;flex:1}
.selall{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--red);cursor:pointer;
  border:1px solid var(--red);border-radius:999px;padding:6px 12px;background:var(--red-s)}
.selall .ti{font-size:14px}
.gcard{background:var(--surf);border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:11px}
.ghead{display:flex;align-items:center;gap:11px;margin-bottom:2px;cursor:pointer}
.gth{width:52px;height:52px;flex:0 0 52px;border-radius:13px;overflow:hidden;background:#E4DCD0}
.gth img{width:100%;height:100%;object-fit:cover}
.gnm{font-family:"Almarai";font-weight:700;font-size:14.5px;line-height:1.35;word-break:break-word}
.gsub{font-size:11px;color:var(--mut);line-height:1.45;word-break:break-word}
.gcard .lines{background:transparent;border:0;border-radius:0;padding:0;border-top:1px dashed var(--line2);margin-top:8px}
.addrbox{background:var(--surf);border:1px solid var(--line);border-radius:17px;padding:14px;margin:18px 0 0}
.addrbox.need{border-color:var(--red);outline:1.5px solid var(--red);outline-offset:-1.5px}
.atitle{display:flex;align-items:center;gap:7px;font-family:"Almarai";font-weight:800;font-size:14.5px;margin-bottom:3px}
.atitle .ti{font-size:18px;color:var(--red)}
.ahint{font-size:11.5px;color:var(--faint);margin-bottom:10px}
.acard{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:14px;
  padding:11px 12px;margin-bottom:7px;cursor:pointer;transition:all .15s;background:var(--bg)}
.acard.on{border-color:var(--red);background:var(--red-s)}
.adot{width:20px;height:20px;flex:0 0 20px;align-self:center;border-radius:50%;border:1.5px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.acard.on .adot{background:var(--red);border-color:var(--red);color:#fff}
.alab{display:block;font-family:"Almarai";font-weight:700;font-size:13.5px;line-height:1.35}
.atxt{font-size:11.5px;color:var(--mut);line-height:1.45;word-break:break-word}
.aadd{display:flex;align-items:center;justify-content:center;gap:7px;border:1px dashed var(--line2);
  border-radius:14px;padding:12px;font-family:"Almarai";font-weight:700;font-size:13px;color:var(--red);
  cursor:pointer;background:transparent}
.aadd .ti{font-size:18px}
.gpsbtn{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--line2);background:var(--bg);
  border-radius:14px;padding:12px;font-family:"IBM Plex Sans Arabic";font-size:13px;color:var(--ink);
  cursor:pointer;margin-bottom:12px;text-align:start}
.gpsbtn .ti{font-size:20px;color:var(--red)}
.gpsbtn.ok{border-color:var(--red);background:var(--red-s)}
.gpsbtn small{display:block;font-size:11px;color:var(--mut)}
.frow{display:flex;gap:9px;margin-bottom:11px}
.field{flex:1;min-width:0}
.field label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:5px}
.field input{width:100%;height:44px;border:1px solid var(--line2);border-radius:13px;background:var(--bg);
  padding:0 12px;font-family:"IBM Plex Sans Arabic";font-size:14px;color:var(--ink);outline:none}
.field input:focus{border-color:var(--red)}
.tchips{display:flex;gap:8px;margin-bottom:12px}
.tchip{flex:1;text-align:center;border:1px solid var(--line2);border-radius:13px;padding:10px 4px;
  font-family:"Almarai";font-weight:700;font-size:12.5px;color:var(--mut);cursor:pointer;background:var(--bg)}
.tchip.on{background:var(--red);border-color:var(--red);color:#fff}
.trkwrap{margin-bottom:2px}
.trk{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}
.trkh{display:flex;align-items:center;gap:9px}
.stpill{flex:0 0 auto;font-size:10.5px;border-radius:999px;padding:3px 10px;color:#fff;
  background:var(--red);white-space:nowrap}
.trkid{flex:1;min-width:0;font-size:11px;color:var(--faint)}
.trketa{font-family:"Almarai";font-weight:700;font-size:13.5px;margin-top:8px;line-height:1.35}
.trkit{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.45}
.bar{height:5px;border-radius:3px;background:var(--line2);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--red)}
.trkf{display:flex;gap:8px;margin-top:11px}
.tbtn{flex:1;text-align:center;font-family:"Almarai";font-weight:700;font-size:12.5px;border:1px solid var(--line2);
  border-radius:12px;padding:9px 6px;color:var(--ink);background:var(--bg);cursor:pointer}
.tbtn.pri{background:var(--red-s);border-color:var(--red);color:var(--red)}
.hbox{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line2)}
.htt{font-size:11.5px;color:var(--faint);margin-bottom:9px}

function renderCart(){

  document.getElementById('cartTitle').textContent=t().cart;
  h+='<div class="shead">'+(keys.length?'<span class="selall" data-act="clear"><i class="ti ti-eraser"></i>'+t().clrAll+'</span>':'')+'</div>';
  h+=trackHTML();
  if(!keys.length)h+='<div class="empty">'+t().emptyCart+'</div>'+favHTML()+pastHTML()+addrHTML();
  else{
    var byP={};
    keys.filter(function(k){return !S[k].src;})
        .forEach(function(k){var pid=k.split('|')[0];(byP[pid]=byP[pid]||[]).push(k);});
    Object.keys(byP).forEach(function(pid){
      var p=prodById(pid), o=orgById(p.o), lines='';
      keysOf(pid).forEach(function(k){if(!S[k].src)lines+=lineHTML(k);});
      h+='<div class="gcard"><div class="ghead" data-act="open" data-p="'+p.id+'">'
       +'<div class="gth"><img src="'+prodImg(p)+'" alt="" width="52" height="52" loading="lazy" decoding="async" onerror="this.remove()"></div>'
       +'<div style="flex:1;min-width:0"><div class="gnm">'+nm(p)+'</div>'
       +'<div class="gsub">'+o.f+' '+nm(o)+' · '+subOf(p)+'</div></div>'
       +'<i class="ti ti-chevron-left" style="color:var(--faint)"></i></div>'
       +'<div class="lines">'+lines+'</div></div>';
    });
    h+=favHTML();
    h+=pastHTML();
    h+=addrHTML();
  }
  b.innerHTML=h;
  paintFoot();
}

function renderDoc(){
  var k=docOpen; if(!k)return;

  document.getElementById('docTitle').textContent=doc.t;
  var h='<div class="doc">'+(doc.lead?'<p class="lead">'+doc.lead+'</p>':'');
  if(k==='faq'){
    h+=doc.q.map(function(x,i){
      var open=!!faqOpen[k+i];
      return '<div class="faqq'+(open?' open':'')+'"><div class="q" data-act="faqq" data-i="'+i+'">'
       +'<span style="flex:1;min-width:0">'+x[0]+'</span><i class="ti ti-chevron-down"></i></div>'
       +(open?'<div class="a">'+x[1]+'</div>':'')+'</div>';
    }).join('');
  } else {
    h+=doc.s.map(function(x,i){
      return '<div class="docsec"><h3><span class="num">'+(i+1)+'</span><span>'+x[0]+'</span></h3><p>'+x[1]+'</p></div>';
    }).join('');
  }
  h+='<div class="docnote">'+(L==='ar'?'النص مأخوذ من الصفحات الرسمية لمصنع الأنعام':'Text sourced from the official Alanaam pages')+'</div></div>';
  document.getElementById('dbody').innerHTML=h;
}

/* swipe the sheet down to dismiss */
[psheet,csheet,document.getElementById('usheet'),document.getElementById('dsheet')].forEach(function(sh){
  var y0=0,dragging=false;
  sh.addEventListener('pointerdown',function(e){
    if(sh.scrollTop>2)return; if(e.target.closest('.opt,.pp,.stp,.chk,.lx,.btn,.pay,.selall'))return;
    dragging=true;y0=e.clientY;});
  sh.addEventListener('pointermove',function(e){
    if(!dragging)return; var dy=e.clientY-y0;
    if(dy>0){sh.classList.add('drag');sh.style.transform='translateY('+dy+'px)';}});
  sh.addEventListener('pointerup',function(e){
    if(!dragging)return; dragging=false; var dy=e.clientY-y0;
    sh.classList.remove('drag'); sh.style.transform='';
    if(dy>90){if(sh===csheet)closeCart();else if(sh.id==='usheet')closeProfile();else if(sh.id==='dsheet')closeDoc();else closeProduct(false);}});
  sh.addEventListener('pointercancel',function(){dragging=false;sh.classList.remove('drag');sh.style.transform='';});
});

/* ---------- one handler drives everything ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el)return;
  var a=el.dataset.act, k=el.dataset.k, p=null;
  if(a==='open'){openProduct(prodById(el.dataset.p));return;}
  if(a==='closep'){closeProduct(false);return;}
  if(a==='donep'){closeProduct(true);return;}
  if(a==='closec'){closeCart();return;}
  if(a==='openfav'){
    openCart();
    setTimeout(function(){
      var f=document.querySelector('#cbody .past');
      if(f&&f.scrollIntoView)f.scrollIntoView({block:'start',behavior:'smooth'});
    },260);
    return;
  }
  if(a==='doc'){openDoc(el.dataset.d);return;}
  if(a==='closed'){closeDoc();return;}
  if(a==='faqq'){var kk=docOpen+el.dataset.i;faqOpen[kk]=!faqOpen[kk];renderDoc();return;}
  if(a==='openprof'){openProfile();return;}
  if(a==='closeu'){closeProfile();return;}
  if(a==='notif'){NOTIF=!NOTIF;renderProfile();return;}
  if(a==='langrow'){setLang(L==='ar'?'en':'ar');return;}
  if(a==='help'){var oi=el.dataset.o;HELPOPEN[oi]=!HELPOPEN[oi];refreshSheets();return;}
  if(a==='issue'){HELPPICK[el.dataset.o]=+el.dataset.j;refreshSheets();return;}
  if(a==='trackit'){return;}
  if(a==='addr'){addrId=+el.dataset.a;refreshSheets();return;}
  if(a==='ptick'||a==='pprep'||a==='pinc'||a==='pdec'||a==='pdel'){
    var kind=el.dataset.s||'past', store=(kind==='fav'?FAV:PAST), u=store[k];
    if(!u)return;
    if(a==='ptick'){ if(S[k])delete S[k]; else S[k]={prep:u.prep,q:u.q,chk:true,src:kind}; }
    if(a==='pprep'){var j=+el.dataset.j;u.prep=j; if(S[k])S[k].prep=j;}
    if(a==='pinc'){u.q++; if(S[k])S[k].q++;}
    if(a==='pdec'){if(u.q>1)u.q--; if(S[k]&&S[k].q>1)S[k].q--;}
    if(a==='pdel'){
      delete FAV[k]; if(S[k]&&S[k].src==='fav')delete S[k];
      paintCard(prodById(u.p)); sumCart(); refreshSheets(); return;
    }
    paintCard(prodById(u.p)); sumCart();
    var done=syncUnit(k,kind);
    if(done){paintFoot(); if(profOpen)renderProfile();}
    else refreshSheets();
    return;
  }
  if(a==='cfav'){
    var pp=prodById(el.dataset.p), had=false;
    Object.keys(FAV).forEach(function(kk){if(kk.split('|')[0]==pp.id){delete FAV[kk];had=true;}});
    if(!had)FAV[pp.id+'|0']={p:pp.id,i:0,prep:0,q:1};
    paintCard(pp); sumCart(); refreshSheets(); return;
  }
  if(a==='fav'){
    var pid=+k.split('|')[0], oi=+k.split('|')[1], st=S[k];
    if(FAV[k])delete FAV[k];
    else FAV[k]={p:pid,i:oi,prep:st?st.prep:0,q:st?st.q:1};
    sumCart(); if(openP)renderProduct(); refreshSheets(); return;
  }
  if(a==='newaddr'){addrForm=true;F={gps:0,zone:'',street:'',type:'house',bldg:'',floor:'',unit:''};refreshSheets();return;}
  if(a==='cancaddr'){addrForm=false;refreshSheets();return;}
  if(a==='atype'){readForm();F.type=el.dataset.t;refreshSheets();return;}
  if(a==='gps'){
    readForm();
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(function(){F.gps=1;refreshSheets();},function(){F.gps=2;refreshSheets();},{timeout:8000});
    } else {F.gps=2;refreshSheets();}
    return;
  }
  if(a==='saveaddr'){
    readForm();
    if(!formOK()){
      var first=document.getElementById(!F.zone?'f_zone':(!F.street?'f_street':(F.type==='house'?'f_bldg':(!F.floor?'f_floor':'f_unit'))));
      if(first){first.style.borderColor='var(--red)';first.focus();}
      return;
    }
    var na={id:aid++,zone:F.zone,street:F.street,type:F.type,bldg:F.bldg,floor:F.floor,unit:F.unit};
    ADDR.push(na);addrId=na.id;addrForm=false;refreshSheets();return;
  }
  if(a==='opencart'){closeProduct(true);openCart();return;}
  if(a==='opt'){
    p=prodById(el.dataset.p); k=p.id+'|'+el.dataset.i;
    if(!S[k])S[k]={prep:0,q:1,chk:true};
    else if(S[k].chk)delete S[k];
    else S[k].chk=true;
  }
  else if(a==='clear'){ S={}; }
  else if(k){
    p=prodById(k.split('|')[0]);
    if(a==='prep')S[k].prep=+el.dataset.j;
    else if(a==='inc')S[k].q++;
    else if(a==='dec'){if(S[k].q>1)S[k].q--;else delete S[k];}
    else if(a==='del')delete S[k];
    else if(a==='chk')S[k].chk=!S[k].chk;
    else return;
  }
  else return;
  if(a==='clear')P.forEach(paintCard); else if(p)paintCard(p);
  if(openP)renderProduct();
  refreshSheets();
  sumCart();
});

/* ---------- brand bar follows the scroll exactly; origins bar stays ---------- */
var topBar=document.getElementById('topbar'), brandBar=document.getElementById('brandbar'),
    orowEl=document.getElementById('origins'), BH=0, barRaf=null;
function measureBar(){BH=brandBar.offsetHeight;}
window.addEventListener('resize',function(){measureBar();syncBar();});
function syncBar(){
  if(!BH)measureBar();
  var o=Math.min(BH,Math.max(0,window.pageYOffset));
  topBar.style.transform='translate3d(0,'+(-o)+'px,0)';
}
window.addEventListener('scroll',function(){
  if(barRaf)return;
  barRaf=requestAnimationFrame(function(){barRaf=null;syncBar();});
},{passive:true});

var spyRaf=null;
function doSpy(){
  if(Date.now()-lock<900)return;
  var top0=(orowEl?orowEl.offsetHeight:50);
  var probe=top0+Math.min(window.innerHeight*0.45,340), c=-1;
  CATS.forEach(function(cat,i){
    var h=document.getElementById('sec-'+cat.id); if(!h)return;
    if(h.getBoundingClientRect().top<=probe)c=i;
  });
  if(c<0){CATS.forEach(function(cat,i){if(c<0&&document.getElementById('sec-'+cat.id))c=i;});}
  if(c!==A){A=c;paintRail();var x=railEl.children[A];if(x&&x.scrollIntoView)x.scrollIntoView({block:'nearest',behavior:'smooth'});}
}
window.addEventListener('scroll',function(){
  if(spyRaf)return;
  spyRaf=requestAnimationFrame(function(){spyRaf=null;doSpy();});
},{passive:true});

setLang('ar'); measureBar(); syncBar();
})();
</script>
