  --line:rgba(21,23,26,.10); --line2:rgba(21,23,26,.20);
  --red:#8E1C2B; --red-s:#F7E9EB; --gold:#B08D3F;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;

h1,h2,.dsp{font-family:"Almarai",system-ui,sans-serif;font-weight:800}
img{display:block;max-width:100%}
.ti{line-height:1}

header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);

.brand{display:flex;align-items:center;gap:10px;padding:9px 14px 7px}
.mark{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--surf);border:1px solid var(--line);

.mark img{width:100%;height:100%;object-fit:contain;padding:3px}
.brand h1{font-size:17px;margin:0;line-height:1.15}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.hbtn{height:36px;border-radius:11px;border:1px solid var(--line2);background:var(--surf);
  display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;color:var(--ink)}
.lang{padding:0 12px;font-size:12.5px;font-weight:500}
.prof{width:36px;flex:0 0 36px;font-size:19px}

.orow{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:5px 14px 11px;scrollbar-width:none}
.orow::-webkit-scrollbar{display:none}
.org{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  background:var(--surf);border:1px solid var(--line);font-size:13px;color:var(--mut);white-space:nowrap;
  transition:all .16s;user-select:none;cursor:pointer}
.org b{font-weight:500}
.org .fl{font-size:15px;line-height:1}
.org .n{font-size:11px;color:var(--faint)}
.org.on{background:var(--ink);border-color:var(--ink);color:#fff}
.org.on .n{color:rgba(255,255,255,.6)}

.hero{position:relative;margin:12px 14px 0;border-radius:18px;overflow:hidden;height:192px;background:#2A1F1C}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.74}
.hero .hov{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  padding:16px;background:linear-gradient(to top,rgba(12,10,9,.85),rgba(12,10,9,.15) 62%,transparent)}
.hero .eyebrow{font-size:11px;letter-spacing:.12em;color:#E8D9B4}
.hero h2{color:#fff;font-size:22px;margin:3px 0 4px;line-height:1.25}
.hero p{color:rgba(255,255,255,.82);font-size:12.5px;margin:0}

.trust{display:flex;gap:8px;padding:12px 14px 2px}
.tr{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center}
.tr .ti{font-size:22px;color:var(--red);display:block;margin-bottom:4px}
.tr span{font-size:10.5px;color:var(--mut);line-height:1.3;display:block}

main{padding:0 14px}
.sec{display:flex;align-items:center;gap:12px;padding:24px 0 12px}
.logo{width:54px;height:54px;flex:0 0 54px;border-radius:50%;position:relative}
.logo .ring{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:2px solid var(--surf);
  box-shadow:0 0 0 1.5px var(--red);background:#E4DCD0}
.logo .ring img{width:100%;height:100%;object-fit:cover}
.logo .bdg{position:absolute;bottom:-3px;inset-inline-end:-3px;width:22px;height:22px;border-radius:50%;
  background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;
  border:2px solid var(--bg)}
.sec .ttl{font-family:"Almarai";font-weight:800;font-size:17.5px;line-height:1.25}
.sec .cnt{font-size:11.5px;color:var(--faint);font-weight:400}
.sec .ln{flex:1;height:1px;background:var(--line)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px}
.card.has{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:11px}
.ph{width:86px;height:86px;flex:0 0 86px;border-radius:14px;background:#E4DCD0;

.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .ti{font-size:30px}
.nm{font-family:"Almarai";font-weight:700;font-size:15.5px;line-height:1.35;margin:0 0 5px}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.flagchip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:2px 8px;font-size:11px}
.tagp{font-size:10.5px;color:var(--gold);border:1px solid rgba(176,141,63,.45);border-radius:999px;padding:1px 7px}
.rate{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--gold)}
.rate .ti{font-size:12px}

.track{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 11px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.opt{flex:0 0 auto;min-width:88px;border:1px solid var(--line2);border-radius:13px;padding:8px 11px;
  text-align:center;background:var(--surf);cursor:pointer;user-select:none;transition:all .15s}
.opt .q{display:block;font-family:"Almarai";font-weight:700;font-size:13.5px;line-height:1.25}
.opt .p{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}
.opt.on{background:var(--red);border-color:var(--red);color:#fff}
.opt.on .p{color:rgba(255,255,255,.82)}
.opt.on .q:before{content:"✓ ";font-size:11.5px}

.lines{border-top:1px dashed var(--line2);padding-top:6px}
.ln1{padding:10px 0;border-bottom:1px solid var(--line)}
.ln1:last-child{border-bottom:0}
.ln1.off{opacity:.45}
.lhead{display:flex;align-items:center;gap:9px}
.chk{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:1.5px solid var(--line2);cursor:pointer;

.chk.on{background:var(--red);border-color:var(--red);color:#fff}
.lname{flex:1;min-width:0;font-family:"Almarai";font-weight:700;font-size:13.5px}
.lx{border:0;background:transparent;color:var(--faint);font-size:17px;padding:2px 4px;cursor:pointer;line-height:1}

.pp.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pp .x{font-size:10px;opacity:.7;margin-inline-start:3px}
.lfoot{display:flex;align-items:center;gap:10px;margin-inline-start:31px;margin-top:8px}
.stp{display:flex;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:2px}

.lunit{font-size:11px;color:var(--faint);font-weight:400;margin-inline-end:5px}

.tab.on{color:#fff;background:var(--red)}
.tab.off{opacity:.32}

.sheet.show{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}

.gth img{width:100%;height:100%;object-fit:cover}

.pay:disabled{background:var(--line);color:var(--faint)}
.empty{text-align:center;color:var(--mut);padding:26px 0;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function t(){return T[L];}
function money(v){return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function nm(x){return L==='ar'?x.ar:x.en;}
function orgById(id){for(var i=0;i<ORIGINS.length;i++)if(ORIGINS[i].id===id)return ORIGINS[i];return{ar:"",en:"",f:""};}
function catById(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];}
function prodById(id){for(var i=0;i<P.length;i++)if(P[i].id==id)return P[i];}
function anyOrg(){for(var k in ORG)if(ORG[k])return true;return false;}
function visible(){return P.filter(function(p){return !anyOrg()||ORG[p.o];});}
function optLabel(o){return o.w!=null?((o.w%1?o.w.toFixed(1):o.w)+' '+t().kg):nm(o);}
function subOf(p){return p.rate?t().perkg(p.rate):(L==='ar'?p.sar:p.sen);}
function tagOf(p){return p.tar?(L==='ar'?p.tar:p.ten):null;}
function catFull(c){return L==='ar'?c.arF:c.enF;}
function prodImg(p){return p.img||IMG[catById(p.c).im];}
function prepSet(p){return PREP[catById(p.c).prep];}
function keysOf(pid){var a=[];for(var k in S)if(k.split('|')[0]==pid)a.push(k);
  return a.sort(function(x,y){return (+x.split('|')[1])-(+y.split('|')[1]);});}
function lineOf(k){var pr=k.split('|'),p=prodById(pr[0]),o=p.opts[+pr[1]],st=S[k];
  var unit=o.p+prepSet(p)[st.prep].x; return {p:p,o:o,st:st,unit:unit,sum:unit*st.q};}

/* ---------- shared line markup: identical in card and cart ---------- */
function lineHTML(k,i){
  var l=lineOf(k), set=prepSet(l.p), chips='';
  set.forEach(function(s,j){
    chips+='<div class="pp'+(j===l.st.prep?' on':'')+'" data-act="prep" data-k="'+k+'" data-j="'+j+'">'
      +nm(s)+(s.x?'<span class="x">+'+s.x+'</span>':'')+'</div>';
  });
  return '<div class="ln1'+(l.st.chk?'':' off')+'">'
   +'<div class="lhead"><span class="chk'+(l.st.chk?' on':'')+'" data-act="chk" data-k="'+k+'"><i class="ti ti-check"></i></span>'
   +'<span class="lname">'+optLabel(l.o)+'</span>'
   +'<button class="lx" data-act="del" data-k="'+k+'">×</button></div>'
   +'<div class="preps">'+chips+'</div>'
   +'<div class="lfoot"><span class="stp"><button data-act="inc" data-k="'+k+'">+</button><b>'+l.st.q+'</b>'
   +'<button data-act="dec" data-k="'+k+'">−</button></span>'
   +'<span class="lprice">'+(l.st.q>1?'<span class="lunit">'+t().each(money(l.unit))+'</span>':'')+money(l.sum)+'</span></div></div>';
}

function buildOrigins(){
  orgEl.innerHTML='';

  all.innerHTML='<span class="fl">🛒</span><b>'+t().all+'</b><span class="n">'+P.length+'</span>';
  all.onclick=function(){ORG={};paintOrg();render();};
  orgEl.appendChild(all);
  ORIGINS.forEach(function(o){
    var n=P.filter(function(p){return p.o===o.id;}).length;
    var e=document.createElement('div'); e.className='org'; e.dataset.o=o.id;
    e.innerHTML='<span class="fl">'+o.f+'</span><b>'+nm(o)+'</b><span class="n">'+n+'</span>';
    e.onclick=function(){ORG[o.id]=!ORG[o.id];if(!ORG[o.id])delete ORG[o.id];paintOrg();render();};
    orgEl.appendChild(e);
  });
  paintOrg();
}
function paintOrg(){
  document.getElementById('org-all').classList.toggle('on',!anyOrg());
  [].forEach.call(orgEl.querySelectorAll('.org[data-o]'),function(e){e.classList.toggle('on',!!ORG[e.dataset.o]);});
}

function buildTabs(){
  tabsEl.innerHTML='';
  CATS.forEach(function(c,i){
    var e=document.createElement('div'); e.className='tab'; e.dataset.i=i;
    e.innerHTML='<i class="ti '+c.ic+'"></i>'+nm(c);
    tabsEl.appendChild(e);
  });
}
var dx0=0,sl0=0,dragging=false,moved=0;
tabsEl.addEventListener('pointerdown',function(e){dragging=true;moved=0;dx0=e.clientX;sl0=tabsEl.scrollLeft;tabsEl.classList.add('drag');});
tabsEl.addEventListener('pointermove',function(e){if(!dragging)return;var d=e.clientX-dx0;moved=Math.max(moved,Math.abs(d));tabsEl.scrollLeft=sl0-d;});
tabsEl.addEventListener('pointerup',function(e){
  if(!dragging)return; dragging=false; tabsEl.classList.remove('drag');
  if(moved<6){var x=e.target.closest('.tab');if(x&&!x.classList.contains('off'))goto(+x.dataset.i);}
});
tabsEl.addEventListener('pointerleave',function(){dragging=false;tabsEl.classList.remove('drag');});
function goto(i){
  var h=document.getElementById('sec-'+CATS[i].id); if(!h)return;
  lock=Date.now(); A=i; paintTabs(); off=0; hdr.style.transform='translateY(0)';
  window.scrollTo({top:h.getBoundingClientRect().top+window.pageYOffset-hdr.offsetHeight-8,behavior:'smooth'});
}
function paintTabs(){
  var vis=visible();
  [].forEach.call(tabsEl.children,function(e,i){
    var has=vis.some(function(p){return p.c===CATS[i].id;});
    e.classList.toggle('off',!has); e.classList.toggle('on',i===A&&has);
  });
}

/* ---------- catalogue ---------- */
function render(){
  var vis=visible(); main.innerHTML='';
  CATS.forEach(function(c){
    var items=vis.filter(function(p){return p.c===c.id;});
    if(!items.length)return;
    var h=document.createElement('div'); h.className='sec'; h.id='sec-'+c.id;
    h.innerHTML='<div class="logo"><div class="ring"><img src="'+IMG[c.im]+'" alt="" loading="lazy" onerror="this.remove()"></div>'
      +'<span class="bdg"><i class="ti '+c.ic+'"></i></span></div>'
      +'<div><div class="ttl">'+catFull(c)+'</div><div class="cnt">'+items.length+' '+t().items+'</div></div><div class="ln"></div>';
    main.appendChild(h);
    items.forEach(function(p){main.appendChild(card(p));});
  });
  if(!vis.length){var e=document.createElement('div');e.className='empty';e.textContent=t().noProd;main.appendChild(e);}
  paintTabs(); P.forEach(paintCard); sumCart();
}

function card(p){
  var o=orgById(p.o), c=catById(p.c), tag=tagOf(p);
  var d=document.createElement('div'); d.className='card'; d.id='card-'+p.id;
  var opts='';
  p.opts.forEach(function(x,i){
    opts+='<div class="opt" data-act="opt" data-p="'+p.id+'" data-i="'+i+'">'
      +'<span class="q">'+optLabel(x)+'</span><span class="p">'+money(x.p)+'</span></div>';
  });
  d.innerHTML=
   '<div class="top">'
   +'<div class="ph"><i class="ti '+c.ic+'"></i><img src="'+prodImg(p)+'" alt="" loading="lazy" onerror="this.remove()"></div>'
   +'<div style="flex:1;min-width:0"><div class="nm">'+nm(p)+'</div>'
   +'<div class="meta"><span class="flagchip">'+o.f+' '+nm(o)+'</span><span>'+subOf(p)+'</span>'
   +(tag?'<span class="tagp">'+tag+'</span>':'')
   +'<span class="rate"><i class="ti ti-star-filled"></i>'+(p.r||4.5).toFixed(1)+'</span></div></div></div>'
   +'<div class="track">'+opts+'</div>'
   +'<div id="ln-'+p.id+'"></div>'
   +'<div class="buy" id="buy-'+p.id+'"></div>';
  return d;
}

function paintCard(p){
  var d=document.getElementById('card-'+p.id); if(!d)return;
  var keys=keysOf(p.id), total=0, html='';
  keys.forEach(function(k,i){total+=lineOf(k).sum;html+=lineHTML(k,i+1);});
  [].forEach.call(d.querySelectorAll('.opt'),function(e){
    e.classList.toggle('on',!!S[p.id+'|'+e.dataset.i]);
  });
  document.getElementById('ln-'+p.id).innerHTML=keys.length?'<div class="lines">'+html+'</div>':'';
  document.getElementById('buy-'+p.id).innerHTML=keys.length
    ? '<div class="tot"><span class="lb">'+t().cardTotal+'</span><span class="v">'+money(total)+'</span> <span class="c">'+t().cur+'</span></div>'
      +'<button class="gocart" data-act="open"><i class="ti ti-shopping-bag"></i>'+t().openCart+'</button>'
    : '';
  d.classList.toggle('has',keys.length>0);
}

/* ---------- cart sheet: same lines, live-bound ---------- */
function totals(){
  var s=0,n=0,all=0;
  for(var k in S){var l=lineOf(k);all+=l.sum;if(S[k].chk){s+=l.sum;n+=S[k].q;}}
  return {sel:s,n:n,all:all};
}
function sumCart(){
  var x=totals();
  document.getElementById('fabTotal').textContent=money(x.sel)+' '+t().cur;
  document.getElementById('fab').classList.toggle('show',Object.keys(S).length>0);
}
function renderSheet(){
  var b=document.getElementById('sheetBody'), keys=Object.keys(S), h='';
  var allOn=keys.length&&keys.every(function(k){return S[k].chk;});
  h+='<div class="shead"><div class="stitle">'+t().cart+'</div>'
   +(keys.length?'<span class="selall" data-act="all">'+(allOn?t().clrAll:t().selAll)+'</span>':'')+'</div>';
  if(!keys.length)h+='<div class="empty">'+t().emptyCart+'</div>';
  else{
    var byP={};
    keys.forEach(function(k){var pid=k.split('|')[0];(byP[pid]=byP[pid]||[]).push(k);});
    Object.keys(byP).forEach(function(pid){
      var p=prodById(pid), o=orgById(p.o), ks=keysOf(pid), lines='';
      ks.forEach(function(k,i){lines+=lineHTML(k,i+1);});
      h+='<div class="gcard"><div class="ghead"><div class="gth"><img src="'+prodImg(p)+'" alt="" onerror="this.remove()"></div>'
       +'<div style="flex:1;min-width:0"><div class="gnm">'+nm(p)+'</div>'
       +'<div class="gsub">'+o.f+' '+nm(o)+' · '+subOf(p)+'</div></div></div>'
       +'<div class="lines">'+lines+'</div></div>';
    });
    var x=totals();
    h+='<div class="sumbox">'
     +'<div class="srow"><span>'+t().sub+'</span><span>'+money(x.sel)+' '+t().cur+'</span></div>'
     +'<div class="srow"><span>'+t().del+'</span><span>'+t().free+'</span></div>'
     +'<div class="srow tot2"><span>'+t().total+'</span><b>'+money(x.sel)+' '+t().cur+'</b></div>'
     +'<button class="pay"'+(x.n?'':' disabled')+'>'+(x.n?t().payN(x.n):t().pay)+'</button></div>';
  }
  b.innerHTML=h;
}
function openSheet(){sheetOpen=true;renderSheet();veil.classList.add('show');sheet.classList.add('show');}

  var a=el.dataset.act, k=el.dataset.k, p;
  if(a==='opt'){
    p=prodById(el.dataset.p); k=p.id+'|'+el.dataset.i;
    if(S[k])delete S[k]; else S[k]={prep:0,q:1,chk:true};
  }
  else if(a==='open'){openSheet();return;}
  else if(a==='all'){
    var ks=Object.keys(S), allOn=ks.length&&ks.every(function(x){return S[x].chk;});
    ks.forEach(function(x){S[x].chk=!allOn;});
  }
  else if(k){
    p=prodById(k.split('|')[0]);
    if(a==='prep')S[k].prep=+el.dataset.j;
    else if(a==='inc')S[k].q++;
    else if(a==='dec'){if(S[k].q>1)S[k].q--;else delete S[k];}
    else if(a==='del')delete S[k];
    else if(a==='chk')S[k].chk=!S[k].chk;
  }
  if(a==='all')P.forEach(paintCard); else if(p)paintCard(p);
  if(sheetOpen)renderSheet();
  sumCart();
});

/* ---------- header ---------- */
var off=0,lastY=0,H=0;
function measure(){H=hdr.offsetHeight;}
window.addEventListener('resize',measure);
window.addEventListener('scroll',function(){
  var y=Math.max(0,window.pageYOffset), d=y-lastY; lastY=y;
  if(!H)measure();
  if(y<=4)off=0; else off=Math.min(H,Math.max(0,off+d*0.85));
  hdr.style.transform='translateY('+(-off)+'px)';
  if(Date.now()-lock<700)return;
  var hh=Math.max(12,hdr.offsetHeight-off)+34, c=A;
  CATS.forEach(function(cat,i){
    var h=document.getElementById('sec-'+cat.id); if(!h)return;
    if(h.getBoundingClientRect().top<=hh)c=i;
  });
  if(c!==A){A=c;paintTabs();var x=tabsEl.children[A];if(x)x.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}
},{passive:true});

setLang('ar'); measure();
})();
